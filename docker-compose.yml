version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dreamtale
      POSTGRES_PASSWORD: dreamtale
      POSTGRES_DB: dreamtale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dreamtale:dreamtale@db:5432/dreamtale
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
      TTS_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081,http://localhost:19006
    depends_on:
      - db
      - redis

volumes:
  pgdata:
